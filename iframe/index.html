<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="timing-diagram-title">时序图编辑器</title>
    <link rel="stylesheet" href="/iframe/style.css">
    <script src="/iframe/default.js"></script>
    <script src="/iframe/wavedrom.min.js"></script>
</head>
<body>
    <div class="container">
        <aside class="config-sidebar">
            <div class="sidebar-header">
                <h3 data-i18n="config-list">配置列表</h3>
                <div class="sidebar-actions">
                    <button id="new-config-btn" class="icon-btn" data-i18n-title="new-config" title="新建配置">+</button>
                    <button id="rename-config-btn" class="icon-btn" data-i18n-title="rename-config" title="重命名">✎</button>
                    <button id="import-config-btn" class="icon-btn" data-i18n-title="import-config" title="导入配置">⬇</button>
                    <button id="export-config-btn" class="icon-btn" data-i18n-title="export-config" title="导出配置">⬆</button>
                    <button id="delete-config-btn" class="icon-btn icon-btn-danger" data-i18n-title="delete-config" title="删除配置">✕</button>
                </div>
            </div>
            <div class="config-list" id="config-list"></div>
        </aside>
        <main class="main-content">
            <section class="editor-section">
                <div class="section-header">
                    <h3 data-i18n="wavejson-editor">WaveJSON 编辑器</h3>
                    <div class="editor-actions">
                        <button id="theme-toggle-btn" class="btn btn-secondary" data-i18n-title="theme-toggle" title="切换主题">🌓</button>
                        <button id="save-config-btn" class="btn btn-primary" data-i18n="save-config">保存配置</button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <div id="line-numbers" class="line-numbers"></div>
                    <textarea id="wavejson-editor" class="code-editor" spellcheck="false"></textarea>
                </div>
            </section>
            <div class="resize-handle" id="resize-handle"></div>
            <section class="preview-section">
                <div class="section-header">
                    <h3 data-i18n="preview">预览</h3>
                </div>
                <div id="waveform-preview" class="preview-container"></div>
            </section>
        </main>
    </div>
    <footer class="action-bar">
        <div class="action-bar-left">
            <button id="help-btn" class="btn btn-secondary" data-i18n="help">教程1</button>
            <button id="help2-btn" class="btn btn-secondary" data-i18n="help2">教程2</button>
        </div>
        <div class="action-bar-right">
            <button id="export-btn" class="btn btn-primary" data-i18n="export">导出</button>
            <button id="apply-btn" class="btn btn-success" data-i18n="apply">应用</button>
            <button id="cancel-btn" class="btn btn-secondary" data-i18n="cancel">取消</button>
        </div>
    </footer>
    <script src="/iframe/app.js"></script>

    <!-- 自定义弹窗 -->
    <div id="custom-dialog-overlay" class="dialog-overlay" style="display:none">
        <div class="dialog-box">
            <div class="dialog-title" id="dialog-title"></div>
            <div class="dialog-body">
                <div id="dialog-message" class="dialog-message"></div>
                <input id="dialog-input" class="dialog-input" type="text" style="display:none">
            </div>
            <div class="dialog-footer">
                <button id="dialog-cancel-btn" class="btn btn-secondary" data-i18n="cancel" style="display:none">取消</button>
                <button id="dialog-confirm-btn" class="btn btn-primary" data-i18n="confirm">确定</button>
            </div>
        </div>
    </div>
</body>
</html>
